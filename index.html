<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload & Streaming Video (.mp4 / .mov)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f5f6f8;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .video-card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      border: 1px solid #e5e7eb;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 6px;
    }
    p.sub {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    .upload-area {
      display: block;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #f8fafc;
    }
    .upload-area:hover,
    .upload-area.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .upload-area input[type="file"] {
      display: none;
    }
    .upload-title {
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
    }
    .upload-hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    .player-wrapper {
      display: none;
      margin-top: 16px;
    }
    video {
      width: 100%;
      max-height: 360px;
      border-radius: 12px;
      background: #000;
      display: block;
    }
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }
    .file-info {
      font-size: 12px;
      color: #475569;
      word-break: break-all;
    }
    .btn-save {
      display: inline-block;
      padding: 9px 14px;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-save:hover {
      background: #374151;
    }
    .error-msg {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      color: #dc2626;
      background: #fef2f2;
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="video-card">
    <h2>Upload &amp; Streaming Video</h2>
    <p class="sub">Mendukung format <strong>.mp4</strong> dan <strong>.mov</strong>, langsung putar dan simpan.</p>

    <label class="upload-area" id="dropZone">
      <input type="file" id="videoFileInput" accept="video/mp4,video/quicktime,.mp4,.mov" />
      <div class="upload-title">Klik untuk pilih video atau tarik file ke sini</div>
      <div class="upload-hint">Format didukung: MP4, MOV</div>
    </label>

    <div class="error-msg" id="errorMsg"></div>

    <div class="player-wrapper" id="playerWrapper">
      <video id="videoPlayer" controls playsinline preload="metadata"></video>
      <div class="meta-bar">
        <span class="file-info" id="videoMeta"></span>
        <a class="btn-save" id="downloadVideoBtn" download="video.mp4">Simpan Video</a>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const dropZone = document.getElementById("dropZone");
      const input = document.getElementById("videoFileInput");
      const playerWrapper = document.getElementById("playerWrapper");
      const player = document.getElementById("videoPlayer");
      const meta = document.getElementById("videoMeta");
      const downloadBtn = document.getElementById("downloadVideoBtn");
      const errorMsg = document.getElementById("errorMsg");

      let currentObjectUrl = null;

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = "block";
      }

      function clearError() {
        errorMsg.textContent = "";
        errorMsg.style.display = "none";
      }

      function handleFile(file) {
        if (!file) return;
        clearError();

        const allowedExt = /\.(mp4|mov)$/i.test(file.name);
        const allowedMime = ["video/mp4", "video/quicktime"].includes(file.type);

        if (!allowedExt && !allowedMime) {
          showError("Format tidak didukung. Gunakan file .mp4 atau .mov.");
          input.value = "";
          return;
        }

        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
        }

        currentObjectUrl = URL.createObjectURL(file);
        player.src = currentObjectUrl;
        playerWrapper.style.display = "block";
        player.load();

        const extMatch = file.name.match(/\.(mp4|mov)$/i);
        const ext = extMatch ? extMatch[0].toLowerCase() : ".mp4";
        downloadBtn.href = currentObjectUrl;
        downloadBtn.download = `video-${Date.now()}${ext}`;

        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        meta.textContent = `${file.name} (${sizeMB} MB)`;
      }

      input.addEventListener("change", (e) => {
        handleFile(e.target.files && e.target.files[0]);
      });

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });

      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) handleFile(file);
      });
    })();
  </script>
</body>
</html>
